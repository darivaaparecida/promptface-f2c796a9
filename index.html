<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptFace — Sua imaginação. Seu rosto. Infinitas possibilidades.</title>
    <meta
      name="description"
      content="Crie fotografias incrivelmente realistas de você em qualquer lugar, situação ou estilo usando inteligência artificial que preserva sua identidade facial."
    />
    <meta property="og:title" content="PromptFace — Sua imaginação. Seu rosto. Infinitas possibilidades." />
    <meta
      property="og:description"
      content="Envie fotos do seu rosto, configure seu Perfil Visual e gere fotografias realistas em 84 cenários prontos ou criação livre."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pf_theme');
          var d = document.documentElement;
          if (t === 'light') {
            d.classList.remove('dark');
            d.dataset.theme = 'light';
            d.style.colorScheme = 'light';
          } else {
            d.classList.add('dark');
            d.dataset.theme = 'dark';
            d.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-950 dark:bg-[#08080C] dark:text-white antialiased selection:bg-[#7C3AED]/30 selection:text-slate-950 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
